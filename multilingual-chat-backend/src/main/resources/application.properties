# Server
server.port=8080

# MySQL Database
# Use environment variables for sensitive credentials in production
# Set MYSQL_DB_URL, MYSQL_DB_USERNAME, MYSQL_DB_PASSWORD environment variables
spring.datasource.url=${MYSQL_DB_URL:jdbc:mysql://localhost:3306/multilingual_chat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_DB_USERNAME:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:Tron@Krish85}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT — Use environment variable in production: set JWT_SECRET
# This is a base64-encoded 256-bit key
app.jwt.secret=${JWT_SECRET:YTJiM2M0ZDVlNmY3ZzhoOWkwajFrMmwzbTRuNW82cDdxOHI5czB0MXUydjN3NHg1eTZ6}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging — restrict sensitive data exposure
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.chat=INFO
