f# Server
server.port=8080

# MySQL Database
# Use environment variables for sensitive credentials in production
# Set MYSQL_DB_URL, MYSQL_DB_USERNAME, MYSQL_DB_PASSWORD environment variables
spring.datasource.url=${MYSQL_URL:jdbc:mysql://mysql-34836827-sriprasanna8585-c9b1.i.aivencloud.com:24951/defaultdb?useSSL=true&requireSSL=true&verifyServerCertificate=false}
spring.datasource.username=${MYSQLUSER:avnadmin}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT — Use environment variable in production: set JWT_SECRET
# This is a base64-encoded 256-bit key
app.jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging — restrict sensitive data exposure
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.chat=INFO
